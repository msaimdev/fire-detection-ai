<!DOCTYPE html>
<html>
<head>
    <title>Fire Detection AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #f8fafc);
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1d4ed8;
        }

        input {
            margin: 20px 0;
            padding: 10px;
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 10px;
        }

        button {
            background: #1d4ed8;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #2563eb;
        }

        .result {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .safe {
            background: #16a34a;
            color: white;
        }

        .card {
            margin-top: 15px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 10px;
            text-align: left;
            color: #111827;
        }

        img {
            width: 100%;
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔥 Fire Detection AI</h1>

    <form action="/predict" method="post" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Analyze Image</button>
    </form>

    {% if prediction %}

        <div class="result {{ badge }}">
            {{ prediction }}
        </div>

        <div class="card">
            <p>🔥 Fire Probability: <b>{{ fire_prob | round(2) }}%</b></p>
            <p>🟢 No Fire Probability: <b>{{ no_fire_prob | round(2) }}%</b></p>
        </div>

        <img src="{{ image_path }}">

    {% endif %}

</div>

</body>
</html>
